<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CineMatch - Movie Recommendation System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--sf:#fff;--ink:#1c1a1f;--mute:#6c6670;--line:#e2d9cd;--ac:#c2410c;--ac2:#7c2d12}
@media(prefers-color-scheme:dark){:root{--bg:#141216;--sf:#1e1b21;--ink:#f3ece4;--mute:#a59ea8;--line:#332e37;--ac:#fb923c;--ac2:#fdba74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{max-width:1000px;margin:auto;padding:26px 18px 6px}
h1{font:400 clamp(2.4rem,9vw,3.8rem)/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.03em;margin:0;color:var(--ac)}
header p{margin:4px 0 0;color:var(--mute)}
main{max-width:1000px;margin:auto;padding:14px 18px 50px}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:22px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
select{margin-bottom:10px}
textarea{min-height:76px;resize:vertical}
.go{width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h2{font:400 1.7rem "Bebas Neue",Impact,sans-serif;letter-spacing:.04em;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.poster{aspect-ratio:2/3;background:linear-gradient(160deg,var(--ac2),#2a1a14);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:#fff;font:400 1.4rem/1.1 "Bebas Neue",Impact,sans-serif;position:relative}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;right:8px;background:var(--ac);color:#fff;font:600 .78rem "DM Sans",sans-serif;padding:2px 8px;border-radius:99px;z-index:1}
.info{padding:10px 12px 12px}
.info b{display:block;line-height:1.25}
.info small{color:var(--mute)}
.imdb{color:#b8860b;font-weight:600}@media(prefers-color-scheme:dark){.imdb{color:#f5c518}}
.filters{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}.filters button{padding:7px 14px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:99px;font:inherit;cursor:pointer}.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.info p{margin:6px 0 0;font-size:.82rem;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#msg{color:var(--ac);min-height:1.3em;margin:0 0 10px}
.hidden{display:none}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:0 18px 30px}
</style>
</head>
<body>
<header><h1>CineMatch</h1><p>Movie recommendations using Natural Language Processing (TF-IDF + cosine similarity).</p></header>
<main>
  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="on" id="t1" role="tab">Similar to a movie</button>
      <button id="t2" role="tab">Describe what you want</button>
    </div>
    <select id="lang" aria-label="Language filter"><option value="">All languages</option><option value="Hindi">Hindi only</option><option value="English">English only</option></select>
    <div id="p1"><input id="title" list="titles" placeholder="Start typing a movie, e.g. 3 Idiots or Inception" aria-label="Movie title"></div>
    <div id="p2" class="hidden"><textarea id="q" placeholder="e.g. a funny Hindi film about friends on a road trip" aria-label="Describe a movie"></textarea></div>
    <button class="go" id="go">Recommend</button>
  </section>
  <p id="msg" role="alert"></p>
  <section id="results" class="hidden"><h2 id="rt">Recommended</h2><div class="grid" id="rg"></div></section>
  <h2>Top rated movies (IMDb)</h2>
  <div class="filters" id="flt"><button class="on" data-l="">All</button><button data-l="Hindi">Hindi</button><button data-l="English">English</button></div>
  <div class="grid" id="all"></div>
  <datalist id="titles"></datalist>
</main>
<footer>Posters via TMDB when an API key is configured. IMDb ratings are approximate. Academic project.</footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode=1;
function tab(n){mode=n;$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);$('p1').classList.toggle('hidden',n!=1);$('p2').classList.toggle('hidden',n!=2)}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
function card(m){
  const el=document.createElement('article');el.className='card';
  el.innerHTML=`<div class="poster">${m.score?`<span class="badge">${m.score}% match</span>`:''}<span>${esc(m.title)}</span></div>
  <div class="info"><b>${esc(m.title)}</b><small>${esc(m.year)} &middot; ${esc(m.language)} &middot; <span class="imdb">&#9733; ${esc(m.imdb)}</span></small><small style="display:block">${esc(m.genres.split(' ').join(', '))}</small><p>${esc(m.overview)}</p></div>`;
  const io=new IntersectionObserver(async(e,o)=>{if(!e[0].isIntersecting)return;o.disconnect();
    try{const r=await(await fetch('/api/poster?title='+encodeURIComponent(m.title)+'&year='+m.year)).json();
      if(r.url){const i=new Image();i.alt='Poster of '+m.title;i.loading='lazy';i.onload=()=>el.querySelector('.poster').appendChild(i);i.src=r.url}}catch(_){}
  });io.observe(el);return el}
function show(list,heading){$('rt').textContent=heading;$('rg').replaceChildren(...list.map(card));$('results').classList.remove('hidden');$('results').scrollIntoView({behavior:'smooth'})}
$('go').onclick=async()=>{
  $('msg').textContent='';
  const lg='&lang='+$('lang').value;
  const url=(mode==1?'/api/recommend?title='+encodeURIComponent($('title').value):'/api/search?q='+encodeURIComponent($('q').value))+lg;
  try{const r=await fetch(url),j=await r.json();
    if(!r.ok){$('msg').textContent=j.error;return}
    show(j,mode==1?'Because you liked '+$('title').value:'Best matches for your description')}
  catch(e){$('msg').textContent='Could not reach the server. Please try again.'}};
let ALL=[];
function renderAll(l){const list=ALL.filter(m=>!l||m.language===l).sort((a,b)=>b.imdb-a.imdb);$('all').replaceChildren(...list.map(card))}
$('flt').onclick=e=>{if(!e.target.dataset)return;[...$('flt').children].forEach(b=>b.classList.toggle('on',b===e.target));renderAll(e.target.dataset.l)};
(async()=>{ALL=(await(await fetch('/api/movies')).json()).map(m=>({...m,imdb:parseFloat(m.imdb)}));
  $('titles').innerHTML=ALL.map(m=>`<option value="${esc(m.title)}">`).join('');renderAll('')})();
</script>
</body>
</html>
